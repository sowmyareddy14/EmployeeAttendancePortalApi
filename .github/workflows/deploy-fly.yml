name: Build and Deploy to Fly

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore
        run: dotnet restore EmployeeAttendancePortalApi/EmployeeAttendancePortalApi.csproj

      - name: Publish
        run: dotnet publish EmployeeAttendancePortalApi/EmployeeAttendancePortalApi.csproj -c Release -o publish

      - name: Install flyctl
        uses: superfly/flyctl-actions@v1
        with:
          args: version

      - name: Deploy to Fly
        uses: superfly/flyctl-actions@v1
        with:
          args: deploy --config ./fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          Solution_Name: EmployeeAttendancePortalApi.sln          # Your actual .sln file name
          Test_Project_Path: path/to/your/test/project.csproj     # Path to your test project
          Wap_Project_Directory: path/to/wap/project              # WAP project directory (if applicable)
          Wap_Project_Path: path/to/wap/project.wapproj           # WAP project file path (if applicable)
